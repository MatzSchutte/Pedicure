services:
  web:
    build: .
    container_name: pedicure-bianca-web
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: pedicure-bianca-nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
