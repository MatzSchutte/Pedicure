# Pas 'jouw-domein.nl' aan naar het echte domein.
# Voor SSL: plaats certificaat + key in ./nginx/certs/ (bijv. via certbot) en
# verwijs hieronder naar de juiste paden.

server {
    listen 80;
    server_name jouw-domein.nl;

    # Herleid alle HTTP-verkeer naar HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name jouw-domein.nl;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # De SQLite-database mag nooit rechtstreeks bereikbaar zijn
    location ~* \.sqlite$ {
        deny all;
        return 404;
    }
}
